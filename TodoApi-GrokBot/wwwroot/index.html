<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的 Todo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: system-ui; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 8px; }
    input[type=text], input[type=email], input[type=password] { flex: 1; padding: 8px; min-width: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .done span { text-decoration: line-through; color: #999; }
    li button { margin-left: auto; }
    #err { color: #c00; min-height: 1.2em; }
    #who { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #who button { margin-left: auto; }
    li button { margin-left: 0; }
    li input.due { margin-left: auto; }
    .overdue span, .overdue input.due { color: #c00; font-weight: bold; }
    #filters { display: flex; gap: 4px; margin: 8px 0; }
    #filters button.active { font-weight: bold; text-decoration: underline; }
    .chart { margin: 16px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>📝 我的 Todo</h1>
  <p id="err"></p>

  <div id="authView">
    <div class="chart"><h3>每月活躍使用者（近 12 個月）</h3><canvas id="mauChart"></canvas></div>
    <h3>登入</h3>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="密碼" required>
      <button>登入</button>
    </form>
    <h3>註冊</h3>
    <form id="registerForm">
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="密碼（至少 8 字元）" required minlength="8">
      <button>註冊</button>
    </form>
  </div>

  <div id="todoView" class="hidden">
    <div id="who"><span>已登入：<b id="whoEmail"></b></span><button id="logoutBtn">登出</button></div>
    <form id="f"><input type="text" id="t" placeholder="要做什麼？" required><input type="date" id="d" title="截止日（可不填）"><button>新增</button></form>
    <div id="filters">
      <button data-status="all" class="active">全部</button>
      <button data-status="active">未完成</button>
      <button data-status="completed">已完成</button>
      <button data-status="overdue">逾期</button>
    </div>
    <ul id="list"></ul>
    <div class="chart"><h3>近 30 天完成數</h3><canvas id="completionsChart"></canvas></div>
  </div>
<script>
const api = '/api/todos';
const showErr = msg => err.textContent = msg || '';

async function errorText(res) {
  try {
    const d = await res.json();
    if (d.error) return d.error;
    if (d.errors) return Object.values(d.errors).flat().join(' ');
    if (d.title) return d.title;
  } catch {}
  return `錯誤 (${res.status})`;
}

// 圖表（Chart.js）：登出畫面顯示 MAU，登入畫面顯示近 30 天完成數
const charts = {};
function drawBar(id, labels, data, label) {
  if (typeof Chart === 'undefined') return;
  charts[id]?.destroy();
  charts[id] = new Chart(document.getElementById(id), {
    type: 'bar',
    data: { labels, datasets: [{ label, data }] },
    options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }, plugins: { legend: { display: false } } }
  });
}
async function loadMau() {
  try {
    const res = await fetch('/api/stats/monthly-active-users');
    if (!res.ok) return;
    const d = await res.json();
    drawBar('mauChart', d.map(x => x.month), d.map(x => x.activeUsers), '活躍使用者');
  } catch {}
}
async function loadCompletions() {
  try {
    const d = await (await authFetch('/api/stats/completions')).json();
    drawBar('completionsChart', d.map(x => x.date.slice(5)), d.map(x => x.count), '完成數');
  } catch {}
}

function render() {
  const token = localStorage.getItem('token');
  authView.classList.toggle('hidden', !!token);
  todoView.classList.toggle('hidden', !token);
  whoEmail.textContent = localStorage.getItem('email') || '';
  if (token) { load(); loadCompletions(); } else { list.innerHTML = ''; loadMau(); }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('email');
  render();
}

// 所有 /api/todos 呼叫都帶 token；401 就清掉 token 回登入畫面
async function authFetch(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}),
    Authorization: `Bearer ${localStorage.getItem('token')}` } });
  if (res.status === 401) { logout(); showErr('登入已失效，請重新登入'); throw new Error('401'); }
  if (!res.ok) { showErr(await errorText(res)); throw new Error(res.status); }
  return res;
}

let statusFilter = 'all';

async function load() {
  const todos = await (await authFetch(`${api}?status=${statusFilter}`)).json();
  list.innerHTML = '';
  todos.forEach(x => {
    const li = document.createElement('li');
    if (x.isDone) li.className = 'done';
    if (x.isOverdue) li.classList.add('overdue');
    li.innerHTML = `<input type="checkbox" ${x.isDone ? 'checked' : ''}><span></span>` +
      `<input type="date" class="due" title="截止日"><button>刪除</button>`;
    li.querySelector('span').textContent = x.title;
    const due = li.querySelector('input.due');
    due.value = x.dueDate || '';
    const save = body => authFetch(`${api}/${x.id}`, { method: 'PUT',
      body: JSON.stringify({ title: x.title, isDone: x.isDone, dueDate: x.dueDate || null, ...body }) });
    li.querySelector('input[type=checkbox]').onchange = async e => {
      await save({ isDone: e.target.checked });
      load(); loadCompletions();
    };
    due.onchange = async () => { await save({ dueDate: due.value || null }); load(); };
    li.querySelector('button').onclick = async () => { await authFetch(`${api}/${x.id}`, { method: 'DELETE' }); load(); loadCompletions(); };
    list.appendChild(li);
  });
}

document.querySelectorAll('#filters button').forEach(b => b.onclick = () => {
  statusFilter = b.dataset.status;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
  load();
});

f.onsubmit = async e => {
  e.preventDefault();
  showErr();
  await authFetch(api, { method: 'POST', body: JSON.stringify({ title: t.value, isDone: false, dueDate: d.value || null }) });
  t.value = ''; d.value = ''; load();
};

async function login(email, password) {
  const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }) });
  if (!res.ok) { showErr(res.status === 401 ? 'Email 或密碼錯誤' : await errorText(res)); return; }
  const d = await res.json();
  localStorage.setItem('token', d.token);
  localStorage.setItem('email', email.trim().toLowerCase());
  showErr(); render();
}

loginForm.onsubmit = e => { e.preventDefault(); login(loginEmail.value, loginPassword.value); };

registerForm.onsubmit = async e => {
  e.preventDefault();
  const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: regEmail.value, password: regPassword.value }) });
  if (!res.ok) { showErr(await errorText(res)); return; }
  await login(regEmail.value, regPassword.value);
};

logoutBtn.onclick = logout;
render();
</script>
</body>
</html>
