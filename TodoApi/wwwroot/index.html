<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的 Todo</title>
  <style>
    body { font-family: system-ui; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 8px; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .done span { text-decoration: line-through; color: #999; }
    li button { margin-left: auto; }
  </style>
</head>
<body>
  <h1>📝 我的 Todo</h1>
  <form id="f"><input type="text" id="t" placeholder="要做什麼？" required><button>新增</button></form>
  <ul id="list"></ul>
<script>
const api = '/api/todos';
async function load() {
  const todos = await (await fetch(api)).json();
  list.innerHTML = '';
  todos.forEach(x => {
    const li = document.createElement('li');
    if (x.isDone) li.className = 'done';
    li.innerHTML = `<input type="checkbox" ${x.isDone ? 'checked' : ''}><span></span><button>刪除</button>`;
    li.querySelector('span').textContent = x.title;
    li.querySelector('input').onchange = async e => {
      await fetch(`${api}/${x.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...x, isDone: e.target.checked }) });
      load();
    };
    li.querySelector('button').onclick = async () => { await fetch(`${api}/${x.id}`, { method: 'DELETE' }); load(); };
    list.appendChild(li);
  });
}
f.onsubmit = async e => {
  e.preventDefault();
  await fetch(api, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: t.value }) });
  t.value = ''; load();
};
load();
</script>
</body>
</html>
